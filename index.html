<!DOCTYPE html>
<!-- ============================================================
     Research Wiki — Search / Retrieve / View Article (MVP1)
     Files: index.html + research.css + research.js + data/wiki-index.js
     Ingest is explicitly out of scope for MVP1. See PHASE1_PLAN.md.
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Wiki</title>
    <link rel="stylesheet" href="research.css">
</head>
<body>
    <div id="research-app" data-screen="search">
        <div class="rw-shell">
            <header class="rw-topbar">
                <span class="rw-wordmark">Research Wiki</span>
                <span class="rw-doc-count" id="rw-doc-count"></span>
            </header>

            <main>
                <!-- ===== search screen ===== -->
                <section class="rw-screen rw-screen-search">
                    <div class="rw-hero">
                        <svg class="rw-hero-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21V11"/>
                            <path d="M12 11C12 6 8 4 4 4c0 5 2 8 8 7Z"/>
                            <path d="M12 13c0-5 4-7 8-7 0 5-2 8-8 7Z"/>
                        </svg>
                        <h1>Ask the research wiki</h1>
                        <p>Ask about civic tech, AI ethics, or SLMs — every answer traces back to a source document from the ingested vault.</p>
                    </div>

                    <div class="rw-search-pill">
                        <input id="rw-input" type="text" placeholder="Ask about civic tech, AI ethics, or SLMs…" />
                        <button class="rw-send" id="rw-send" aria-label="Ask" type="button">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3l12 7-12 7V3Z"/></svg>
                        </button>
                    </div>
                    <p class="rw-hint" id="rw-hint"></p>

                    <div class="rw-section">
                        <div class="rw-section-label">Recommended</div>
                        <div class="rw-chip-grid" id="rw-try-chips"></div>
                    </div>

                    <div class="rw-section" id="rw-recent-section" style="display:none">
                        <div class="rw-section-label">Recent</div>
                        <div class="rw-chip-grid" id="rw-recent-chips"></div>
                    </div>
                </section>

                <!-- ===== ask (conversational) screen ===== -->
                <section class="rw-screen rw-screen-ask">
                    <div class="rw-article-subbar">
                        <button class="rw-back" id="rw-ask-back" type="button">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L6 10l6.5 5.5"/></svg>
                            Back
                        </button>
                        <button class="rw-new-question" id="rw-new-question" type="button">New question</button>
                    </div>

                    <div class="rw-ask-layout rw-split-layout" id="rw-ask-layout">
                        <div class="rw-ask-col">
                            <div class="rw-q-bubble-row">
                                <div class="rw-q-bubble" id="rw-ask-question"></div>
                            </div>

                            <button type="button" class="rw-sources-chip" id="rw-ask-sources"></button>

                            <div class="rw-body" id="rw-ask-body"></div>

                            <button type="button" class="rw-continue-reading" id="rw-ask-continue"></button>
                            <div class="rw-suggestion-row" id="rw-ask-followup-topics"></div>

                            <div class="rw-followup">
                                <input id="rw-followup-input" type="text" placeholder="Ask a follow-up…" />
                                <button class="rw-send" id="rw-followup-send" aria-label="Ask follow-up" type="button">
                                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3l12 7-12 7V3Z"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="rw-pane-backdrop" id="rw-ask-pane-backdrop"></div>
                        <aside class="rw-preview-wrap">
                            <div class="rw-preview" id="rw-ask-preview"></div>
                        </aside>
                    </div>
                </section>

                <!-- ===== related articles screen ===== -->
                <section class="rw-screen rw-screen-results">
                    <div class="rw-results-col">
                        <div class="rw-results-head">
                            <h2 id="rw-results-query"></h2>
                            <button class="rw-new-search" id="rw-related-back" type="button">← Back</button>
                        </div>
                        <p class="rw-results-count" id="rw-results-count"></p>
                        <div id="rw-results-list"></div>
                    </div>
                </section>

                <!-- ===== article screen ===== -->
                <section class="rw-screen rw-screen-article">
                    <div class="rw-article-subbar">
                        <button class="rw-back" id="rw-back" type="button">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L6 10l6.5 5.5"/></svg>
                            Back
                        </button>
                    </div>

                    <div class="rw-article-layout rw-split-layout" id="rw-article-layout">
                        <div class="rw-article-col">
                            <div class="rw-article-meta-row" id="rw-article-meta"></div>
                            <h3 id="rw-article-title"></h3>
                            <div class="rw-article-tags" id="rw-article-tags"></div>
                            <div class="rw-body" id="rw-article-body"></div>

                            <div class="rw-related-cta-row">
                                <button type="button" class="rw-related-cta" id="rw-view-related">View related articles</button>
                            </div>
                        </div>

                        <div class="rw-pane-backdrop" id="rw-pane-backdrop"></div>
                        <aside class="rw-preview-wrap">
                            <div class="rw-preview" id="rw-preview"></div>
                        </aside>
                    </div>
                </section>
            </main>

            <footer class="rw-footer">
                <a class="rw-footer-link" href="https://opencivic.tech" target="_blank" rel="noopener noreferrer">Created for Open Civic Tech</a>
                <span class="rw-footer-version" id="rw-footer-version"></span>
            </footer>
        </div>
    </div>

    <script src="data/wiki-index.js"></script>
    <script src="research.js"></script>
</body>
</html>
